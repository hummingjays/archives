<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR-CHIVES - Sony Trinitron CRT TV Simulator</title>
  
  <!-- PWA Manifest & Service Worker Data-URI -->
  <link rel="manifest" href="data:application/manifest+json,{
    %22name%22: %22AR-CHIVES CRT Simulator%22,
    %22short_name%22: %22AR-CHIVES%22,
    %22start_url%22: %22./index.html%22,
    %22display%22: %22standalone%22,
    %22background_color%22: %22%230f0f11%22,
    %22theme_color%22: %22%230f0f11%22,
    %22icons%22: [{
      %22src%22: %22https://img.icons8.com/color/192/retro-tv.png%22,
      %22sizes%22: %22192x192%22,
      %22type%22: %22image/png%22
    }]
  }">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Retro Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&family=Press+Start+2P&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            vt323: ['VT323', 'monospace'],
            press: ['"Press Start 2P"', 'monospace'],
            mono: ['"Share Tech Mono"', 'monospace'],
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #0b0b0e;
      color: #e2e8f0;
      user-select: none;
      -webkit-user-select: none;
    }
    /* CRT Curved Screen Overlay & Glass Reflection */
    .crt-screen {
      position: relative;
      overflow: hidden;
      background: #000;
      border-radius: 24px;
      box-shadow: inset 0 0 50px rgba(0,0,0,0.9), 0 10px 30px rgba(0,0,0,0.8);
    }
    .crt-screen::before {
      content: " ";
      display: block;
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
      z-index: 30;
      background-size: 100% 3px, 6px 100%;
      pointer-events: none;
    }
    .crt-screen::after {
      content: " ";
      display: block;
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: radial-gradient(circle at center, rgba(255,255,255,0.08) 0%, rgba(0,0,0,0.6) 80%, rgba(0,0,0,0.95) 100%);
      z-index: 31;
      pointer-events: none;
    }
    /* Scanlines toggle */
    .scanlines-off .crt-screen::before {
      display: none;
    }
    /* Power off line collapse animation */
    @keyframes powerOffCollapse {
      0% { transform: scale(1, 1); opacity: 1; filter: brightness(1); }
      60% { transform: scale(0.005, 1); opacity: 1; filter: brightness(3); background-color: #fff; }
      100% { transform: scale(0.005, 0.001); opacity: 0; filter: brightness(5); background-color: #fff; }
    }
    .power-off-anim {
      animation: powerOffCollapse 0.35s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }
    /* Phosphor glow standby dot */
    .standby-led {
      box-shadow: 0 0 8px #ef4444, inset 0 0 3px #fca5a5;
    }
    .power-led {
      box-shadow: 0 0 8px #22c55e, inset 0 0 3px #86efac;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start p-3 sm:p-6 font-mono">

  <!-- Main Chassis Container -->
  <div id="tv-chassis" class="w-full max-w-md bg-[#161619] border-4 border-[#222226] rounded-3xl p-4 sm:p-6 shadow-2xl flex flex-col gap-4 relative">
    
    <!-- Top Branding Header -->
    <div class="flex justify-between items-center px-1">
      <span class="text-xs tracking-widest font-bold text-gray-400">AR-CHIVES</span>
      <div class="flex gap-4 text-[10px] text-gray-500 tracking-wider">
        <span>APERTURE GRILLE</span>
        <span>STEREO SOUND</span>
      </div>
    </div>

    <!-- CRT Monitor Frame -->
    <div id="crt-frame" class="crt-screen w-full aspect-[4/3] border-[12px] border-[#0a0a0c] flex flex-col justify-between p-3 relative">
      
      <!-- OSD Channel & Now Playing Info -->
      <div class="z-40 flex justify-between items-start text-[#22c55e] font-vt323 text-xl sm:text-2xl drop-shadow-[0_2px_4px_rgba(0,0,0,0.9)] opacity-9ul select-none">
        <div id="osd-ch" class="bg-black/40 px-2 py-0.5 rounded backdrop-blur-sm">CH 01</div>
        <div id="osd-playing" class="bg-black/40 px-2 py-0.5 rounded backdrop-blur-sm truncate max-w-[200px] sm:max-w-[240px]">Now playing: Demo Stream</div>
      </div>

      <!-- Screen Center Viewport (Video / Static / Standby) -->
      <div id="screen-viewport" class="absolute inset-0 bg-black flex flex-col items-center justify-center z-20">
        <!-- Standby State -->
        <div id="standby-view" class="flex flex-col items-center justify-center gap-3 cursor-pointer" onclick="togglePower()">
          <div class="w-14 h-14 rounded-full border border-green-500/30 bg-green-500/10 flex items-center justify-center power-led transition hover:scale-105">
            <i class="fa-solid fa-power-off text-green-400 text-xl"></i>
          </div>
          <span class="text-green-500/70 text-xs tracking-widest font-mono animate-pulse">CLICK POWER TO TURN ON TV</span>
        </div>

        <!-- Active Media Element -->
        <video id="tv-video" class="w-full h-full object-contain hidden" playsinline autoplay></video>
        
        <!-- Static Noise Overlay -->
        <div id="static-overlay" class="absolute inset-0 bg-neutral-900 opacity-0 pointer-events-none transition-opacity duration-150 z-30 flex items-center justify-center">
          <div class="text-green-500 font-vt323 text-3xl tracking-widest animate-pulse">STATIC...</div>
        </div>
      </div>

      <!-- Bottom Screen OSD Indicators -->
      <div class="z-40 flex justify-between items-end text-[#22c55e] font-vt323 text-lg sm:text-xl drop-shadow-[0_2px_4px_rgba(0,0,0,0.9)] select-none">
        <div id="osd-vol" class="bg-black/40 px-2 py-0.5 rounded backdrop-blur-sm">VOL 15</div>
        <div id="osd-time" class="bg-black/40 px-2 py-0.5 rounded backdrop-blur-sm">12:00</div>
      </div>
    </div>

    <!-- Front Control Bar -->
    <div class="flex items-center justify-between bg-[#101013] px-4 py-3 rounded-xl border border-white/5">
      <!-- Power Button -->
      <button id="power-btn" onclick="togglePower()" class="w-10 h-10 rounded-full bg-[#1e1e24] border border-white/10 flex items-center justify-center text-red-500 hover:text-red-400 active:scale-95 transition shadow-inner">
        <i class="fa-solid fa-power-off text-base"></i>
      </button>

      <!-- Channel & Volume Toggles -->
      <div class="flex items-center gap-3">
        <button id="scanlines-toggle-front" onclick="togglescanlines()" class="px-3 py-1.5 bg-[#1a1a20] hover:bg-[#25252d] border border-white/10 rounded-lg text-amber-400 font-mono text-xs tracking-wider transition">
          SCANLINES
        </button>
        <div class="flex items-center gap-1 bg-[#161619] p-1 rounded-lg border border-white/5">
          <button onclick="switchChannel(currentChannelIndex - 1)" class="w-8 h-8 rounded bg-[#222228] hover:bg-[#2c2c35] text-gray-300 flex items-center justify-center transition">
            <i class="fa-solid fa-chevron-down text-xs"></i>
          </button>
          <button onclick="switchChannel(currentChannelIndex + 1)" class="w-8 h-8 rounded bg-[#222228] hover:bg-[#2c2c35] text-gray-300 flex items-center justify-center transition">
            <i class="fa-solid fa-chevron-up text-xs"></i>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Remote Control (RM-V980 COMMANDER) -->
  <div class="w-full max-w-md mt-6 bg-[#121215] border-4 border-[#1c1c21] rounded-3xl p-5 shadow-2xl flex flex-col gap-4">
    <div class="text-center pb-2 border-b border-white/5">
      <div class="text-[11px] tracking-widest text-gray-400 font-bold">AR-CHIVES by SENTHILKUMAR</div>
      <div class="text-[9px] tracking-[0.2em] text-gray-600 mt-0.5">RM-V980 COMMANDER</div>
    </div>

    <!-- Dedicated Shuffle Button -->
    <button onclick="shuffleChannel()" class="w-full py-2.5 bg-[#1b1b21] hover:bg-[#24242c] active:scale-[0.99] border border-white/10 rounded-xl text-emerald-400 font-mono text-xs tracking-widest shadow transition flex items-center justify-center gap-2">
      <i class="fa-solid fa-shuffle text-emerald-400"></i> SHUFFLE CHANNEL
    </button>

    <!-- Power & Mute -->
    <div class="grid grid-cols-2 gap-3">
      <button onclick="togglePower()" class="py-3 bg-[#991b1b] hover:bg-[#b91c1c] active:scale-[0.98] rounded-xl text-white font-mono text-xs tracking-wider flex flex-col items-center justify-center gap-1 shadow-lg transition">
        <i class="fa-solid fa-power-off text-sm"></i>
        <span>POWER</span>
      </button>
      <button onclick="toggleMute()" class="py-3 bg-[#222229] hover:bg-[#2a2a33] active:scale-[0.98] rounded-xl text-gray-300 font-mono text-xs tracking-wider flex flex-col items-center justify-center gap-1 shadow transition">
        <i id="mute-icon" class="fa-solid fa-volume-high text-sm"></i>
        <span>MUTE</span>
      </button>
    </div>

    <!-- Skip / Seek Controls -->
    <div class="grid grid-cols-2 gap-3">
      <button onclick="seekTime(-30)" class="py-2.5 bg-[#1a1a20] hover:bg-[#23232b] active:scale-[0.98] rounded-xl text-gray-300 font-mono text-xs flex items-center justify-center gap-2 shadow transition">
        <i class="fa-solid fa-rotate-left"></i> -30s
      </button>
      <button onclick="seekTime(30)" class="py-2.5 bg-[#1a1a20] hover:bg-[#23232b] active:scale-[0.98] rounded-xl text-gray-300 font-mono text-xs flex items-center justify-center gap-2 shadow transition">
        <span>+30s</span> <i class="fa-solid fa-rotate-right"></i>
      </button>
    </div>

    <!-- Vol / Ch Rockers -->
    <div class="grid grid-cols-2 gap-3">
      <!-- Volume Rocker -->
      <div class="bg-[#18181d] p-2 rounded-xl border border-white/5 flex flex-col items-center gap-1">
        <span class="text-[10px] text-gray-500 tracking-widest font-bold">VOL</span>
        <button onclick="setVolume(0.1)" class="w-full py-2 bg-[#222229] hover:bg-[#2c2c35] rounded-lg text-gray-200 text-sm font-bold transition">+</button>
        <button onclick="setVolume(-0.1)" class="w-full py-2 bg-[#222229] hover:bg-[#2c2c35] rounded-lg text-gray-200 text-sm font-bold transition">-</button>
      </div>
      <!-- Channel Rocker -->
      <div class="bg-[#18181d] p-2 rounded-xl border border-white/5 flex flex-col items-center gap-1">
        <span class="text-[10px] text-gray-500 tracking-widest font-bold">CH</span>
        <button onclick="switchChannel(currentChannelIndex + 1)" class="w-full py-2 bg-[#222229] hover:bg-[#2c2c35] rounded-lg text-gray-200 text-sm font-bold transition">
          <i class="fa-solid fa-chevron-up text-xs"></i>
        </button>
        <button onclick="switchChannel(currentChannelIndex - 1)" class="w-full py-2 bg-[#222229] hover:bg-[#2c2c35] rounded-lg text-gray-200 text-sm font-bold transition">
          <i class="fa-solid fa-chevron-down text-xs"></i>
        </button>
      </div>
    </div>

    <!-- Aspect Ratio Toggle -->
    <button onclick="cycleAspectRatio()" class="w-full py-3 bg-[#18181d] hover:bg-[#212128] active:scale-[0.99] border border-white/10 rounded-xl text-cyan-400 font-mono text-xs tracking-wider flex items-center justify-center gap-2 shadow transition">
      <i class="fa-solid fa-expand"></i> ASPECT RATIO: <span id="aspect-label">CONTAIN</span>
    </button>

    <!-- Scanlines Toggle -->
    <button onclick="togglescanlines()" class="w-full py-3 bg-[#18181d] hover:bg-[#212128] active:scale-[0.99] border border-white/10 rounded-xl text-amber-400 font-mono text-xs tracking-wider flex items-center justify-center gap-2 shadow transition">
      <i class="fa-solid fa-bars"></i> SCANLINES TOGGLE
    </button>
  </div>

  <!-- Script Engine -->
  <script>
    // Register Service Worker for PWA installability
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('data:text/javascript,' + encodeURIComponent(`
          self.addEventListener('fetch', (e) => {
            e.respondWith(fetch(e.request).catch(() => new Response("Offline")));
          });
        `)).catch(() => {});
      });
    }

    let isPoweredOn = false;
    let currentChannelIndex = parseInt(localStorage.getItem('crt_last_channel') || '0', 10);
    let volumeLevel = 0.7;
    let isMuted = false;
    let aspectModes = ['contain', 'cover', 'fill'];
    let currentAspectIndex = 0;
    let scanlinesEnabled = true;

    // Sample Channel Playlist
    const channels = [
      { name: "Demo Reel 1", url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" },
      { name: "Elephant Dream", url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4" },
      { name: "For Bigger Blazes", url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4" },
      { name: "Tears of Steel", url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4" }
    ];

    const videoEl = document.getElementById('tv-video');
    const standbyView = document.getElementById('standby-view');
    const staticOverlay = document.getElementById('static-overlay');
    const osdCh = document.getElementById('osd-ch');
    const osdPlaying = document.getElementById('osd-playing');
    const osdVol = document.getElementById('osd-vol');
    const tvChassis = document.getElementById('tv-chassis');

    function togglePower() {
      isPoweredOn = !isPoweredOn;
      const crtFrame = document.getElementById('crt-frame');

      if (isPoweredOn) {
        standbyView.classList.add('hidden');
        videoEl.classList.remove('hidden');
        crtFrame.classList.remove('power-off-anim');
        
        // Restore last channel on startup
        currentChannelIndex = parseInt(localStorage.getItem('crt_last_channel') || '0', 10);
        if (currentChannelIndex >= channels.length) currentChannelIndex = 0;
        
        loadChannel(currentChannelIndex);
        triggerStaticBurst();
      } else {
        // Save current channel before shutting down
        localStorage.setItem('crt_last_channel', currentChannelIndex);
        videoEl.pause();
        videoEl.classList.add('hidden');
        standbyView.classList.remove('hidden');
        osdCh.innerText = "";
        osdPlaying.innerText = "";
        osdVol.innerText = "";
        crtFrame.classList.add('power-off-anim');
      }
    }

    function loadChannel(index) {
      if (!isPoweredOn) return;
      if (index < 0) index = channels.length - 1;
      if (index >= channels.length) index = 0;
      currentChannelIndex = index;
      
      // Save active channel memory
      localStorage.setItem('crt_last_channel', currentChannelIndex);

      const chNumStr = String(currentChannelIndex + 1).padStart(2, '0');
      osdCh.innerText = `CH ${chNumStr}`;
      osdPlaying.innerText = `Now playing: ${channels[currentChannelIndex].name}`;

      triggerStaticBurst();
      videoEl.src = channels[currentChannelIndex].url;
      videoEl.volume = isMuted ? 0 : volumeLevel;
      videoEl.play().catch(e => console.log("Autoplay restricted:", e));
    }

    function switchChannel(index) {
      if (!isPoweredOn) return;
      loadChannel(index);
    }

    function shuffleChannel() {
      if (!isPoweredOn) return;
      let randIndex;
      do {
        randIndex = Math.floor(Math.random() * channels.length);
      } while (randIndex === currentChannelIndex && channels.length > 1);
      loadChannel(randIndex);
    }

    function triggerStaticBurst() {
      staticOverlay.style.opacity = '0.85';
      setTimeout(() => {
        staticOverlay.style.opacity = '0';
      }, 300);
    }

    function setVolume(change) {
      if (!isPoweredOn) return;
      volumeLevel = Math.min(1, Math.max(0, volumeLevel + change));
      if (!isMuted) videoEl.volume = volumeLevel;
      const volPercent = Math.round(volumeLevel * 100);
      osdVol.innerText = `VOL ${volPercent}`;
    }

    function toggleMute() {
      if (!isPoweredOn) return;
      isMuted = !isMuted;
      videoEl.volume = isMuted ? 0 : volumeLevel;
      const icon = document.getElementById('mute-icon');
      icon.className = isMuted ? "fa-solid fa-volume-xmark text-sm text-red-400" : "fa-solid fa-volume-high text-sm";
    }

    function seekTime(seconds) {
      if (!isPoweredOn) return;
      videoEl.currentTime = Math.min(videoEl.duration, Math.max(0, videoEl.currentTime + seconds));
    }

    function cycleAspectRatio() {
      currentAspectIndex = (currentAspectIndex + 1) % aspectModes.length;
      const mode = aspectModes[currentAspectIndex];
      videoEl.className = `w-full h-full object-${mode} hidden`;
      if (isPoweredOn) videoEl.classList.remove('hidden');
      document.getElementById('aspect-label').innerText = mode.toUpperCase();
    }

    function togglescanlines() {
      scanlinesEnabled = !scanlinesEnabled;
      if (scanlinesEnabled) {
        tvChassis.classList.remove('scanlines-off');
      } else {
        tvChassis.classList.add('scanlines-off');
      }
    }

    // OSD Clock updater
    setInterval(() => {
      const now = new Date();
      let hours = now.getHours();
      const minutes = String(now.getMinutes()).padStart(2, '0');
      hours = String(hours).padStart(2, '0');
      document.getElementById('osd-time').innerText = `${hours}:${minutes}`;
    }, 1000);
  </script>
</body>
</html>
