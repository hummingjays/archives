<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>90s Sony Trinitron CRT TV Simulator - AR-CHIVES</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Retro Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&family=Press+Start+2P&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            vt323: ['VT323', 'monospace'],
            arcade: ['"Press Start 2P"', 'monospace'],
            mono: ['"Share Tech Mono"', 'monospace'],
          },
          colors: {
            crtGreen: '#00ff66',
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #0b0b0e;
      color: #e2e8f0;
      user-select: none;
      -webkit-user-select: none;
    }
    /* CRT Curved Screen Overlay & Glass Reflection */
    .crt-screen {
      position: relative;
      overflow: hidden;
      background: #000;
      border-radius: 24px;
      box-shadow: inset 0 0 50px rgba(0,0,0,0.9), 0 10px 30px rgba(0,0,0,0.8);
    }
    .crt-screen::before {
      content: " ";
      display: block;
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
      z-index: 30;
      background-size: 100% 3px, 6px 100%;
      pointer-events: none;
    }
    .crt-screen::after {
      content: " ";
      display: block;
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: radial-gradient(circle at center, rgba(255,255,255,0.08) 0%, rgba(0,0,0,0.6) 80%, rgba(0,0,0,0.95) 100%);
      z-index: 31;
      pointer-events: none;
    }
    /* Scanlines toggle */
    .scanlines-off .crt-screen::before {
      display: none;
    }
    /* Power off line collapse animation */
    @keyframes powerOffCollapse {
      0% { transform: scale(1, 1); opacity: 1; filter: brightness(1); }
      60% { transform: scale(0.005, 1); opacity: 1; filter: brightness(3); background-color: #fff; }
      100% { transform: scale(0.005, 0.001); opacity: 0; filter: brightness(5); background-color: #fff; }
    }
    .power-off-anim {
      animation: powerOffCollapse 0.35s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }
    /* Phosphor glow standby dot */
    .standby-led {
      box-shadow: 0 0 8px #ef4444, inset 0 0 3px #fca5a5;
    }
    .power-led {
      box-shadow: 0 0 8px #22c55e, inset 0 0 3px #86efac;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center
